var KEY_STORE = 'gr-schluessel';
function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function u2b64(u) { var s = ''; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function oeffne(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c)).then(function (pt) {
        var html = new TextDecoder().decode(pt);
        document.open(); document.write(html); document.close();
    });
}
function zeigeLogin(text) {
    document.getElementById('box').style.display = 'block';
    document.getElementById('msg').textContent = text || '';
    document.getElementById('pw').focus();
}
function gespeicherterSchluessel() {
    try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; }
}
if (!window.crypto || !crypto.subtle) {
    zeigeLogin('Dieser Browser unterst\u00fctzt keine Verschl\u00fcsselung (nur \u00fcber https:// \u00f6ffnen).');
} else {
    var k = gespeicherterSchluessel();
    if (k) {
        crypto.subtle.importKey('raw', b64(k), { name: 'AES-GCM' }, false, ['decrypt']).then(oeffne).catch(function () {
            try { localStorage.removeItem(KEY_STORE); } catch (e) {}
            zeigeLogin('Neues Passwort erforderlich (wurde ge\u00e4ndert).');
        });
    } else {
        zeigeLogin('');
    }
}
document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('btn'), pw = document.getElementById('pw').value;
    btn.disabled = true; document.getElementById('msg').textContent = 'Entschl\u00fcssele \u2026';
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (basis) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, basis,
            { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }).then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c)).then(function (pt) {
            if (document.getElementById('merken').checked) {
                return crypto.subtle.exportKey('raw', key).then(function (raw) {
                    try { localStorage.setItem(KEY_STORE, u2b64(raw)); } catch (e) {}
                    return pt;
                });
            }
            return pt;
        });
    }).then(function (pt) {
        var html = new TextDecoder().decode(pt);
        document.open(); document.write(html); document.close();
    }).catch(function () {
        btn.disabled = false;
        document.getElementById('msg').textContent = 'Falsches Passwort.';
    });
});
